name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['pa*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Warms the Maven cache once per POM/wrapper change so the Maven jobs below do
  # not each download plugins and dependencies from Maven Central. Not a required check.
  maven-deps:
    name: maven-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 25 and the Maven cache (saved on a miss)
        id: maven
        uses: ./.github/actions/setup-maven
        with:
          save: 'true'
          show-download-progress: 'true'
      - name: Download dependencies and plugins
        if: steps.maven.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          # The wrapper fetches the Maven distribution with wget and no retry; Resolver's retry
          # does not cover it. Try three times with a 10 s, 20 s backoff.
          for attempt in 1 2 3; do
            sh ./mvnw -B --version && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 10))
          done
          # lint, format-check, typecheck (resolves every build plugin, including spring-boot-maven-plugin).
          sh ./mvnw -B checkstyle:check spotless:check test-compile
          # test and sandbox: Surefire and its JUnit Platform provider are resolved only when tests
          # are launched. The method filter matches no test, so no test runs.
          sh ./mvnw -B test -Dtest='*Test#mavenDepsWarmupMatchesNoTest' -Dsurefire.failIfNoSpecifiedTests=false
      - uses: ./.github/actions/count-maven-downloads
        if: always()

  lint:
    name: lint
    needs: maven-deps
    # Run even if maven-deps failed: a skipped required check would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-checks
      - run: make lint
      - uses: ./.github/actions/count-maven-downloads
        if: always()

  format-check:
    name: format-check
    needs: maven-deps
    # Run even if maven-deps failed: a skipped required check would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-checks
      - run: make format-check
      - uses: ./.github/actions/count-maven-downloads
        if: always()

  typecheck:
    name: typecheck
    needs: maven-deps
    # Run even if maven-deps failed: a skipped required check would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-checks
      - run: make typecheck
      - uses: ./.github/actions/count-maven-downloads
        if: always()

  test:
    name: test
    needs: maven-deps
    # Run even if maven-deps failed: a skipped required check would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-checks
      - name: Verify Docker for Testcontainers
        run: docker info
      - run: make test
      - uses: ./.github/actions/count-maven-downloads
        if: always()

  sandbox:
    name: sandbox
    needs: maven-deps
    # Run even if maven-deps failed: a skipped required check would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-maven
      - run: docker build -t leetkob-sandbox:pa3 sandbox
      - name: Run sandbox and worker restart checks
        working-directory: backend
        env:
          JUDGE_SANDBOX_TESTS: '1'
        run: sh ./mvnw -B -ntp -Dtest=DockerSandboxTest,JudgeWorkerRestartTest test
      - uses: ./.github/actions/count-maven-downloads
        if: always()

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            --output gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan full Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
