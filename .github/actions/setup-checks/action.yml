name: Set up quality checks
description: Install the Java and Python toolchains used by the Makefile.

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
        cache-dependency-path: backend/pom.xml

    - name: Set up uv and Python 3.12
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: '0.13.7'
        python-version: '3.12'
        enable-cache: true
        cache-dependency-glob: checker/uv.lock
