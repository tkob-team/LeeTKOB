# web service: the frontend build plus /api proxied to the API on the same origin.
# caddy (TLS) sits in front; see deploy/Caddyfile.

# Scheme the browser used: caddy sends X-Forwarded-Proto; a direct request has none.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # The client address comes from caddy's X-Forwarded-For, trusted only from the edge
    # network (172.29.250.0/28 in deploy/docker-compose.yml, where caddy is the only other
    # member). The last address is used, and caddy discards any value the client sent, so a
    # client cannot choose its address. A request from anywhere else keeps its own address.
    set_real_ip_from 172.29.250.0/28;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    root /usr/share/nginx/html;

    # A lab body may be up to 4 MiB (docs/contract/lab-authoring.md).
    client_max_body_size 5m;

    # /api/auth/login -> http://api:8080/auth/login (the trailing slash strips /api).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append, so a client cannot spoof its address for the login limit.
        # $remote_addr is the client address resolved by the real_ip rules above.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Dot paths (/.env, /.git/config, /.well-known/...) are never part of the build: answer 404
    # instead of the index.html fallback, so a scanner gets no 200 for them. A regex location
    # wins over the prefix locations above and below. Checked by deploy/check-dotfiles.sh.
    location ~ (^|/)\. {
        return 404;
    }

    # Client-side routes (/login, /ta/labs, ...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
