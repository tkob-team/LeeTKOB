# web service: the frontend build plus /api proxied to the API on the same origin.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # A lab body may be up to 4 MiB (docs/contract/lab-authoring.md).
    client_max_body_size 5m;

    # /api/auth/login -> http://api:8080/auth/login (the trailing slash strips /api).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append, so a client cannot spoof its address for the login limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /ta/labs, ...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
