# Override for deploy/check-client-ip.sh; never used in production.
# Keeps the real caddy, the real nginx.conf and the real networks of docker-compose.yml, but
# replaces the API with a tiny server that echoes the X-Forwarded-For it receives (the header
# the API turns into the client address for the login limit), and adds two test clients.

x-echo: &echo |
  import http.server, json
  class H(http.server.BaseHTTPRequestHandler):
      def do_GET(self):
          body = json.dumps({
              "xff": self.headers.get("X-Forwarded-For"),
              "proto": self.headers.get("X-Forwarded-Proto"),
          }).encode()
          self.send_response(200)
          self.send_header("Content-Type", "application/json")
          self.end_headers()
          self.wfile.write(body)
  http.server.ThreadingHTTPServer(("", 8080), H).serve_forever()

x-client: &client |
  import json, socket, sys, urllib.request
  url, spoof = sys.argv[1], "203.0.113.66"
  request = urllib.request.Request(url, headers={"X-Forwarded-For": spoof})
  seen = json.load(urllib.request.urlopen(request, timeout=10))
  print(json.dumps({"client": socket.gethostbyname(socket.gethostname()), "spoof": spoof, **seen}))

services:
  api:
    image: python:3.12-alpine
    build: !reset null
    depends_on: !reset []
    environment: !reset {}
    command: ['python', '-c', *echo]

  web:
    image: nginx:1.29-alpine
    build: !reset null
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  caddy:
    ports: !reset []
    networks:
      - edge
      - outside

  # A browser on the internet: reaches only caddy.
  outside-client:
    image: python:3.12-alpine
    profiles: ['ipcheck']
    networks:
      - outside
    entrypoint: ['python', '-c', *client]

  # Another container on the internal network calling web directly, bypassing caddy.
  inside-client:
    image: python:3.12-alpine
    profiles: ['ipcheck']
    networks:
      - default
    entrypoint: ['python', '-c', *client]

networks:
  outside: {}
