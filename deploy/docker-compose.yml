# Public deployment of LeetKOB on one Linux VM. Runbook: README.md, "Deployment runbook".
#
#   docker compose -f deploy/docker-compose.yml build   # Compose images
#   docker compose -f deploy/docker-compose.yml up -d
#
# Values come from deploy/.env (copy deploy/.env.example; never commit it). Every service lists
# its variables explicitly; no service loads the whole file, so GEMINI_API_KEY reaches only
# checker-worker. Only sandbox-proxy mounts the Docker socket.
# Only web publishes a port (80). PostgreSQL, the API and the workers stay on the internal network.

name: leetkob

x-database: &database
  DB_URL: jdbc:postgresql://postgres:5432/leetkob
  DB_USER: ${DB_USER:?set DB_USER in deploy/.env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leetkob
      POSTGRES_USER: ${DB_USER:?set DB_USER in deploy/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d leetkob']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: leetkob-api:latest
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # Trust X-Forwarded-For from web (a private address) so the login attempt limit
      # counts the real client address instead of the proxy's.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      LOGGING_STRUCTURED_JSON_ADD_SERVICE: api

  judge-worker:
    image: leetkob-judge-worker:latest
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
      target: judge-worker
    command: ['judge-worker']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-proxy:
        condition: service_started
    networks: [default, sandbox-control]
    environment:
      <<: *database
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      LOGGING_STRUCTURED_JSON_ADD_SERVICE: judge-worker
      JUDGE_SANDBOX_PROXY: http://sandbox-proxy:8091

  sandbox-proxy:
    image: leetkob-sandbox-proxy:latest
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
      target: sandbox-proxy
    command: ['sandbox-proxy']
    restart: unless-stopped
    networks: [sandbox-control]
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID to the Docker socket group}
    volumes:
      - type: bind
        source: ${JUDGE_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      JUDGE_SANDBOX_IMAGE: ${JUDGE_SANDBOX_IMAGE:-leetkob-sandbox:pa3}
      JUDGE_SANDBOX_PROXY_BIND: 0.0.0.0
      JUDGE_SANDBOX_SCOPE: ${COMPOSE_PROJECT_NAME:-leetkob}

  checker-worker:
    image: leetkob-checker:latest
    build:
      context: ../checker
    command: ['worker', '--lease-seconds', '600']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      # The only service with the model key.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      GEMINI_RPM: ${GEMINI_RPM:-}
      MODEL_OFF: ${MODEL_OFF:-}

  observability:
    image: leetkob-checker:latest
    profiles: ['observe']
    entrypoint: ['/app/.venv/bin/python', '-m', 'checker.operations']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
    ports:
      - '127.0.0.1:${OPERATIONS_PORT:-9108}:9108'

  web:
    image: leetkob-web:latest
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
      additional_contexts:
        deploy: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80'

  # One-shot jobs and build-only images; not started by `up`.
  seed:
    image: leetkob-api:latest
    profiles: ['seed']
    command: ['seed']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_TA_PASSWORD: ${SEED_TA_PASSWORD:-}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-}

  seed-load:
    image: leetkob-api:latest
    profiles: ['load']
    command: ['seed-load']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      LOAD_SEED_CLASS_ID: ${LOAD_SEED_CLASS_ID:-}
      LOAD_SEED_SECRET: ${LOAD_SEED_SECRET:-}

  # Pre-launch check: sandbox probes through the same proxy used by judge-worker.
  sandbox-check:
    image: leetkob-sandbox-check:latest
    profiles: ['check']
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
      target: sandbox-check
    restart: 'no'
    depends_on:
      - sandbox-proxy
    networks: [default, sandbox-control]
    volumes:
      - m2:/root/.m2
    environment:
      JUDGE_SANDBOX_PROXY: http://sandbox-proxy:8091

networks:
  sandbox-control:
    internal: true

volumes:
  pgdata:
  m2:
